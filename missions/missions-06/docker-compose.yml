services:
  nginx:
    image: nginx:1.27-alpine
    container_name: shortener-nginx-mission-06
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '${NGINX_CPUS:-0.5}'
          memory: ${NGINX_MEMORY:-128M}
    restart: unless-stopped

  app1:
    <<: &app-common
      build:
        context: ../../
        dockerfile: Dockerfile
      environment:
        - SERVER_PORT=8080
        - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/shortener?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
        - SPRING_DATASOURCE_USERNAME=root
        - SPRING_DATASOURCE_PASSWORD=root
        - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${APP_DB_POOL_SIZE:-10}
        - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=${APP_DB_MIN_IDLE:-2}
        - SPRING_DATA_REDIS_HOST=redis
        - SPRING_DATA_REDIS_PORT=6379
        - SHORTENER_CACHE_ENABLED=${SHORTENER_CACHE_ENABLED:-true}
        - SHORTENER_CACHE_TTL_SECONDS=${SHORTENER_CACHE_TTL_SECONDS:-3600}
        - SHORTENER_ACCESS_LOG_MODE=${SHORTENER_ACCESS_LOG_MODE:-SMART_BATCH}
        - SHORTENER_ACCESS_LOG_ASYNC_CORE_POOL_SIZE=${SHORTENER_ACCESS_LOG_ASYNC_CORE_POOL_SIZE:-4}
        - SHORTENER_ACCESS_LOG_ASYNC_MAX_POOL_SIZE=${SHORTENER_ACCESS_LOG_ASYNC_MAX_POOL_SIZE:-8}
        - SHORTENER_ACCESS_LOG_ASYNC_QUEUE_CAPACITY=${SHORTENER_ACCESS_LOG_ASYNC_QUEUE_CAPACITY:-10000}
        - SHORTENER_ACCESS_LOG_BATCH_QUEUE_CAPACITY=${SHORTENER_ACCESS_LOG_BATCH_QUEUE_CAPACITY:-20000}
        - SHORTENER_ACCESS_LOG_BATCH_SIZE=${SHORTENER_ACCESS_LOG_BATCH_SIZE:-500}
        - SHORTENER_ACCESS_LOG_BATCH_FLUSH_INTERVAL_MS=${SHORTENER_ACCESS_LOG_BATCH_FLUSH_INTERVAL_MS:-100}
        - SHORTENER_ACCESS_LOG_SMART_BATCH_QUEUE_CAPACITY=${SHORTENER_ACCESS_LOG_SMART_BATCH_QUEUE_CAPACITY:-20000}
        - SHORTENER_ACCESS_LOG_SMART_BATCH_SIZE=${SHORTENER_ACCESS_LOG_SMART_BATCH_SIZE:-200}
        - SHORTENER_ACCESS_LOG_SMART_BATCH_FLUSH_INTERVAL_MS=${SHORTENER_ACCESS_LOG_SMART_BATCH_FLUSH_INTERVAL_MS:-50}
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      deploy:
        resources:
          limits:
            cpus: '${APP_CPUS:-1.0}'
            memory: ${APP_MEMORY:-512M}
      restart: unless-stopped
    container_name: shortener-app1-mission-06
    ports:
      - "${APP1_PORT:-8081}:8080"

  app2:
    <<: *app-common
    container_name: shortener-app2-mission-06
    ports:
      - "${APP2_PORT:-8082}:8080"

  app3:
    <<: *app-common
    container_name: shortener-app3-mission-06
    ports:
      - "${APP3_PORT:-8083}:8080"

  redis:
    image: redis:7.2-alpine
    container_name: shortener-redis-mission-06
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS:-0.5}'
          memory: ${REDIS_MEMORY:-256M}
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: shortener-db-mission-06
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=shortener
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - mysql-data-mission-06:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${DB_CPUS:-1.0}'
          memory: ${DB_MEMORY:-1G}
    restart: unless-stopped

volumes:
  mysql-data-mission-06:
