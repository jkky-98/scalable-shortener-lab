services:
  nginx:
    image: nginx:1.27-alpine
    container_name: shortener-nginx-mission-09
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '${NGINX_CPUS:-0.5}'
          memory: ${NGINX_MEMORY:-128M}
    restart: unless-stopped

  app1:
    <<: &app-common
      build:
        context: ../../
        dockerfile: Dockerfile
      environment:
        - SERVER_PORT=8080
        - SHORTENER_DATASOURCE_ROUTING_ENABLED=true
        - SHORTENER_DATASOURCE_PRIMARY_URL=jdbc:mysql://db-primary:3306/shortener?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
        - SHORTENER_DATASOURCE_PRIMARY_USERNAME=root
        - SHORTENER_DATASOURCE_PRIMARY_PASSWORD=root
        - SHORTENER_DATASOURCE_PRIMARY_MAXIMUM_POOL_SIZE=${APP_DB_PRIMARY_POOL_SIZE:-10}
        - SHORTENER_DATASOURCE_PRIMARY_MINIMUM_IDLE=${APP_DB_PRIMARY_MIN_IDLE:-2}
        - SHORTENER_DATASOURCE_REPLICA_URL=jdbc:mysql://db-replica:3306/shortener?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
        - SHORTENER_DATASOURCE_REPLICA_USERNAME=root
        - SHORTENER_DATASOURCE_REPLICA_PASSWORD=root
        - SHORTENER_DATASOURCE_REPLICA_MAXIMUM_POOL_SIZE=${APP_DB_REPLICA_POOL_SIZE:-10}
        - SHORTENER_DATASOURCE_REPLICA_MINIMUM_IDLE=${APP_DB_REPLICA_MIN_IDLE:-2}
        - SPRING_DATA_REDIS_HOST=redis
        - SPRING_DATA_REDIS_PORT=6379
        - SHORTENER_CACHE_ENABLED=${SHORTENER_CACHE_ENABLED:-false}
        - SHORTENER_CACHE_TTL_SECONDS=${SHORTENER_CACHE_TTL_SECONDS:-3600}
        - SHORTENER_ACCESS_LOG_MODE=${SHORTENER_ACCESS_LOG_MODE:-SMART_BATCH}
        - SHORTENER_ACCESS_LOG_ASYNC_CORE_POOL_SIZE=${SHORTENER_ACCESS_LOG_ASYNC_CORE_POOL_SIZE:-4}
        - SHORTENER_ACCESS_LOG_ASYNC_MAX_POOL_SIZE=${SHORTENER_ACCESS_LOG_ASYNC_MAX_POOL_SIZE:-8}
        - SHORTENER_ACCESS_LOG_ASYNC_QUEUE_CAPACITY=${SHORTENER_ACCESS_LOG_ASYNC_QUEUE_CAPACITY:-10000}
        - SHORTENER_ACCESS_LOG_BATCH_QUEUE_CAPACITY=${SHORTENER_ACCESS_LOG_BATCH_QUEUE_CAPACITY:-20000}
        - SHORTENER_ACCESS_LOG_BATCH_SIZE=${SHORTENER_ACCESS_LOG_BATCH_SIZE:-500}
        - SHORTENER_ACCESS_LOG_BATCH_FLUSH_INTERVAL_MS=${SHORTENER_ACCESS_LOG_BATCH_FLUSH_INTERVAL_MS:-100}
        - SHORTENER_ACCESS_LOG_SMART_BATCH_QUEUE_CAPACITY=${SHORTENER_ACCESS_LOG_SMART_BATCH_QUEUE_CAPACITY:-20000}
        - SHORTENER_ACCESS_LOG_SMART_BATCH_SIZE=${SHORTENER_ACCESS_LOG_SMART_BATCH_SIZE:-200}
        - SHORTENER_ACCESS_LOG_SMART_BATCH_FLUSH_INTERVAL_MS=${SHORTENER_ACCESS_LOG_SMART_BATCH_FLUSH_INTERVAL_MS:-50}
      depends_on:
        db-primary:
          condition: service_healthy
        db-replica:
          condition: service_healthy
        redis:
          condition: service_healthy
      deploy:
        resources:
          limits:
            cpus: '${APP_CPUS:-1.0}'
            memory: ${APP_MEMORY:-512M}
      restart: unless-stopped
    container_name: shortener-app1-mission-09
    ports:
      - "${APP1_PORT:-8081}:8080"

  app2:
    <<: *app-common
    container_name: shortener-app2-mission-09
    ports:
      - "${APP2_PORT:-8082}:8080"

  app3:
    <<: *app-common
    container_name: shortener-app3-mission-09
    ports:
      - "${APP3_PORT:-8083}:8080"

  redis:
    image: redis:7.2-alpine
    container_name: shortener-redis-mission-09
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS:-0.5}'
          memory: ${REDIS_MEMORY:-256M}
    restart: unless-stopped

  db-primary:
    image: mysql:8.0
    container_name: shortener-db-primary-mission-09
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=shortener
    ports:
      - "${DB_PRIMARY_PORT:-3309}:3306"
    volumes:
      - mysql-primary-data-mission-09:/var/lib/mysql
      - ./mysql/primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${DB_PRIMARY_CPUS:-1.0}'
          memory: ${DB_PRIMARY_MEMORY:-1G}
    restart: unless-stopped

  db-replica:
    image: mysql:8.0
    container_name: shortener-db-replica-mission-09
    command:
      - --server-id=2
      - --relay-log=mysql-relay-bin
      - --read-only=1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=shortener
    ports:
      - "${DB_REPLICA_PORT:-3310}:3306"
    volumes:
      - mysql-replica-data-mission-09:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${DB_REPLICA_CPUS:-1.0}'
          memory: ${DB_REPLICA_MEMORY:-1G}
    restart: unless-stopped

volumes:
  mysql-primary-data-mission-09:
  mysql-replica-data-mission-09:
