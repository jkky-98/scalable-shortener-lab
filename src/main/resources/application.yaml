server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: scalable-shortener
  datasource:
    # Docker 환경: db 서비스명 사용
    # 로컬 환경: localhost 사용 (환경변수로 오버라이드 가능)
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shortener?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update # 실무에선 validate를 쓰지만, 편의상 update
    properties:
      hibernate:
        format_sql: false # 로그 깔끔하게 하기 위해 false
    open-in-view: false # 중요: OSIV 끔 (DB 커넥션 최적화)
    show-sql: false
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      repositories:
        enabled: false

shortener:
  datasource:
    routing:
      enabled: ${SHORTENER_DATASOURCE_ROUTING_ENABLED:false}
      primary:
        url: ${SHORTENER_DATASOURCE_PRIMARY_URL:${spring.datasource.url}}
        username: ${SHORTENER_DATASOURCE_PRIMARY_USERNAME:${spring.datasource.username}}
        password: ${SHORTENER_DATASOURCE_PRIMARY_PASSWORD:${spring.datasource.password}}
        driver-class-name: ${SHORTENER_DATASOURCE_PRIMARY_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
        maximum-pool-size: ${SHORTENER_DATASOURCE_PRIMARY_MAXIMUM_POOL_SIZE:10}
        minimum-idle: ${SHORTENER_DATASOURCE_PRIMARY_MINIMUM_IDLE:2}
        connection-timeout: ${SHORTENER_DATASOURCE_PRIMARY_CONNECTION_TIMEOUT:30000}
      replica:
        url: ${SHORTENER_DATASOURCE_REPLICA_URL:${spring.datasource.url}}
        username: ${SHORTENER_DATASOURCE_REPLICA_USERNAME:${spring.datasource.username}}
        password: ${SHORTENER_DATASOURCE_REPLICA_PASSWORD:${spring.datasource.password}}
        driver-class-name: ${SHORTENER_DATASOURCE_REPLICA_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
        maximum-pool-size: ${SHORTENER_DATASOURCE_REPLICA_MAXIMUM_POOL_SIZE:10}
        minimum-idle: ${SHORTENER_DATASOURCE_REPLICA_MINIMUM_IDLE:2}
        connection-timeout: ${SHORTENER_DATASOURCE_REPLICA_CONNECTION_TIMEOUT:30000}
  cache:
    enabled: ${SHORTENER_CACHE_ENABLED:false}
    ttl-seconds: ${SHORTENER_CACHE_TTL_SECONDS:3600}
    key-prefix: ${SHORTENER_CACHE_KEY_PREFIX:shortener:url:}

logging:
  level:
    root: INFO
    com.example.shortener: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
    org.springframework.data.jpa: DEBUG
